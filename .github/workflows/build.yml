name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debian:
    name: Debian Package (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3-pyqt6 python3-pyqt6.qtwebengine

      - name: Build .deb
        working-directory: ./debian
        run: |
          dpkg-buildpackage -us -uc -b -d

      - name: Verify .deb package
        run: |
          dpkg -I ../mini-browser_*_all.deb
          dpkg -c ../mini-browser_*_all.deb

      - name: Find .deb artifact
        id: deb
        run: |
          FILE=$(ls ../mini-browser_*_all.deb | head -1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename $FILE)" >> $GITHUB_OUTPUT

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: mini-browser-debian
          path: ${{ steps.deb.outputs.file }}
          retention-days: 7

  windows:
    name: Windows Build (PyInstaller)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt6 PyQt6-WebEngine pyinstaller
          # Install ImageMagick for SVG to ICO conversion
          choco install imagemagick --no-progress || true

      - name: Convert SVG to ICO for Windows
        run: |
          if (Test-Path "debian/usr/share/icons/hicolor/scalable/apps/mini-browser.svg") {
            magick convert "debian/usr/share/icons/hicolor/scalable/apps/mini-browser.svg" -define icon:auto-resize=256,128,64,48,32,16 "mini-browser.ico"
          }

      - name: Build Windows executable
        run: |
          $iconArgs = @()
          if (Test-Path "mini-browser.ico") { $iconArgs += "--icon=mini-browser.ico" }
          pyinstaller --onefile --windowed --name mini-browser `
            --add-data "locale;locale" `
            $iconArgs `
            mini-browser.py

      - name: Rename artifact with version
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = "dev-$(date -Format 'yyyyMMdd')" }
          Rename-Item -Path "dist/mini-browser.exe" -Destination "dist/mini-browser-win64-$version.exe" -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: mini-browser-windows
          path: dist/mini-browser-win64-*.exe
          retention-days: 7

  release:
    name: Create Release
    needs: [debian, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mini-browser-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}